# Evolution API (WhatsApp) para uso local com o Visual Office Manager.
#   docker compose up -d
# Painel/Manager: http://localhost:8080/manager   (chave em AUTHENTICATION_API_KEY no .env)
services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.8
    container_name: evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # permite enviar webhooks ao app no seu computador (Linux)
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: unless-stopped
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_pg:
  evolution_redis:
